<text class="t cell" x="360" y="684" fill="#37474f">pin 19</text>
<text class="t cell" x="470" y="684">GND</text>
<rect x="46" y="696" width="10" height="22" fill="#1565c0"/>
<text class="t cell" x="66" y="714">STHS34PF80  SDA</text>
<text class="t cell" x="360" y="714" fill="#1565c0">pin 10</text>
<text class="t cell" x="470" y="714">I2C0 SDA = GPIO16</text>
<rect x="46" y="726" width="10" height="22" fill="#1565c0"/>
<text class="t cell" x="66" y="744">STHS34PF80  SCL</text>
<text class="t cell" x="360" y="744" fill="#1565c0">pin 8</text>
<text class="t cell" x="470" y="744">I2C0 SCL = GPIO17</text>
<rect x="46" y="756" width="10" height="22" fill="#c62828"/>
<text class="t cell" x="66" y="774">Servo       +</text>
<text class="t cell" x="360" y="774" fill="#c62828">pin 2</text>
<text class="t cell" x="470" y="774">5V out</text>
<rect x="46" y="786" width="10" height="22" fill="#37474f"/>
<text class="t cell" x="66" y="804">Servo       &#8722;</text>
<text class="t cell" x="360" y="804" fill="#37474f">pin 20</text>
<text class="t cell" x="470" y="804">GND, the second one</text>
<rect x="46" y="816" width="10" height="22" fill="#2e7d32"/>
<text class="t cell" x="66" y="834">Servo       signal</text>
<text class="t cell" x="360" y="834" fill="#2e7d32">pin 3</text>
<text class="t cell" x="470" y="834">GPIO27, 50 Hz PWM</text>
<rect x="46" y="846" width="10" height="22" fill="#6a1b9a"/>
<text class="t cell" x="66" y="864">IO level</text>
<text class="t cell" x="360" y="864" fill="#6a1b9a">pin 4</text>
<text class="t cell" x="470" y="864">V PINS IN &#8212; tie to pin 6 for 3.3V IO</text>
<text class="t sig" x="60" y="928" fill="#1b1f24">Gotchas</text>
<text class="t note" x="60" y="958" fill="#6a1b9a">1.</text>
<text class="t note" x="88" y="958">Pin 4 (V PINS IN) powers the field side of the level shifters and the I2C buffer. Nothing on this header works until it is tied to a voltage:</text>
<text class="t note" x="60" y="986" fill="#6a1b9a"></text>
<text class="t note" x="88" y="986">jumper 4&#8211;6 for 3.3V parts. The Orca Maestro's “VIO Select” jumper is exactly that, so dropping the module silently kills the bus.</text>
<text class="t note" x="60" y="1014" fill="#6a1b9a">2.</text>
<text class="t note" x="88" y="1014">The I2C pair runs through a PCA9517 repeater, which is not a pull-up. Keep the sensor breakout's own pull-ups, or add 4.7k on SDA and SCL to 3.3V.</text>
<text class="t note" x="60" y="1042" fill="#6a1b9a">3.</text>
<text class="t note" x="88" y="1042">Only pins 19 and 20 are ground, and neither sits beside the I2C pair. Run both, one alongside the I2C bundle.</text>
</svg>